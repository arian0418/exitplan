name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: mkdir -p build && javac -encoding UTF-8 -Xlint:all -d build *.java
      - run: |
          for suite in PlanCalculatorTest PlanTimelineTest PlanFilesTest ActivityTableModelTest; do
            java -cp build "$suite" || exit 1
          done
      - run: xvfb-run -a java -cp build ExitPlanGuiTest
